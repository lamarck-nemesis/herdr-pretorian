name: Build artifacts (manual)

on:
  workflow_dispatch:
    inputs:
      prova_visual:
        description: Capturar somente a aparência de candidato Linux existente
        type: boolean
        default: false
      candidato_run:
        description: Identificador da construção candidata
        type: string
      candidato_tentativa:
        description: Tentativa da construção candidata
        type: string
      candidato_artefato:
        description: Identificador do artefato Linux
        type: string
      candidato_commit:
        description: Commit completo da construção candidata
        type: string
      candidato_zip_sha256:
        description: SHA-256 do ZIP candidato
        type: string
      candidato_binario_sha256:
        description: SHA-256 do executável candidato
        type: string
      build_group:
        description: which artifacts to build
        required: true
        default: linux
        type: choice
        options:
          - linux
          - macos
          - windows
          - all
      libghostty_optimize:
        description: libghostty-vt optimize mode for this build
        required: true
        default: ReleaseSafe
        type: choice
        options:
          - ReleaseSafe
          - ReleaseFast
          - ReleaseSmall
          - Debug
      libghostty_simd:
        description: build libghostty-vt with SIMD-accelerated code paths
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  verificar:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Conferir candidato no macOS Apple Silicon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          run_id=44344197817
          repo=lamarck-nemesis/herdr-pretorian
          gh run watch "$run_id" --repo "$repo" --exit-status --interval 45
          gh run download "$run_id" --repo "$repo" --name herdr-macos-aarch64-ReleaseSafe-simd-false --dir candidato
          cd candidato
          python3 - <<'PYTHON'
          import hashlib, json, pathlib
          record = json.loads(pathlib.Path("CI_PROVENANCE.json").read_text())
          assert record["sourceCommit"] == "253263bfe38f04af02d5f4c3963177c3c5adfddc"
          assert record["runId"] == "44344197817"
          digest = hashlib.sha256(pathlib.Path("herdr-macos-aarch64").read_bytes()).hexdigest()
          assert digest == record["binarySha256"]
          print("SHA-256", digest)
          PYTHON
          chmod +x herdr-macos-aarch64
          ./herdr-macos-aarch64 --version
          ./herdr-macos-aarch64 --help >/dev/null

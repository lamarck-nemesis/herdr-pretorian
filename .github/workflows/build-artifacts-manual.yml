name: Build artifacts (manual)

on:
  workflow_dispatch:
    inputs:
      prova_visual:
        description: Capturar somente a aparência de candidato Linux existente
        type: boolean
        default: false
      candidato_run:
        description: Identificador da construção candidata
        type: string
      candidato_tentativa:
        description: Tentativa da construção candidata
        type: string
      candidato_artefato:
        description: Identificador do artefato Linux
        type: string
      candidato_commit:
        description: Commit completo da construção candidata
        type: string
      candidato_zip_sha256:
        description: SHA-256 do ZIP candidato
        type: string
      candidato_binario_sha256:
        description: SHA-256 do executável candidato
        type: string
      build_group:
        description: which artifacts to build
        required: true
        default: linux
        type: choice
        options:
          - linux
          - macos
          - windows
          - all
      libghostty_optimize:
        description: libghostty-vt optimize mode for this build
        required: true
        default: ReleaseSafe
        type: choice
        options:
          - ReleaseSafe
          - ReleaseFast
          - ReleaseSmall
          - Debug
      libghostty_simd:
        description: build libghostty-vt with SIMD-accelerated code paths
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  smoke-macos-intel:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - name: Baixar artefato imutável e conferir origem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/lamarck-nemesis/herdr-pretorian/actions/artifacts/14336054203/zip > candidate.zip
          echo "750ef48379e3d0f03ee582c8bd446903c90399ee3226378e3e2bdd523a4c7bd4  candidate.zip" | shasum -a 256 -c -
          unzip -q candidate.zip -d candidate
          cd candidate
          echo "f0b9e15bca9c7d92f1552b6aecf159617cc25890903318de6ff6c0093a0d0f1d  herdr-macos-x86_64" | shasum -a 256 -c -
          grep -Fx 'commit=f5daadb83fab64a5281336c2f864cb0b88500f94' BUILD_INFO.txt
          grep -Fx 'target=x86_64-apple-darwin' BUILD_INFO.txt
          chmod +x herdr-macos-x86_64
      - name: Executar binário nativo em diretório descartável
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$RUNNER_TEMP/pretorian-smoke-home" results
          run() { env -i HOME="$RUNNER_TEMP/pretorian-smoke-home" PATH=/usr/bin:/bin:/usr/sbin:/sbin TERM=xterm-256color "$PWD/candidate/herdr-macos-x86_64" "$@"; }
          run --version | tee results/version.txt
          grep -F '0.7.0' results/version.txt
          run --help > results/help.txt
          run --default-config > results/default-config.toml
          grep -F 'name = "pretorian"' results/default-config.toml
          cp candidate/CI_PROVENANCE.json results/build-provenance.json
          printf 'Native macOS Intel CLI smoke only; ARM64 runtime not tested.\n' > results/scope.txt
          sw_vers > results/host.txt
      - name: Guardar evidências
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-intel-smoke-f5daadb83fab
          path: results/
          retention-days: 7
